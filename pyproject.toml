[project]
name = "ai-data-agent"
version = "0.1.0"
description = "Multi-agent data assistant: routes natural language questions to a SQL agent or an ETL agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "faker>=40.0.0",
    "ipython>=9.0.0",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "pydantic>=2.8.0",
    "requests>=2.32.0",
]
